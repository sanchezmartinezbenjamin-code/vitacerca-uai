
name: Compilar VitaCerca Wear OS

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
  

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: wearos-android
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VitaCerca-WearOS-APK
          path: wearos-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
